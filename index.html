<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Restaurant Minimalist Icons</title>
  <style>
    body {
      background-color: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .icon-container {
      display: flex;
      gap: 2rem;
    }

    .icon-button {
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .icon-button:hover {
      opacity: 0.7;
    }

    .icon-svg {
      width: 48px;
      height: 48px;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
</head>
<body>

  <div class="icon-container">
    <!-- Ícono 1: Campana de Servicio (Gourmet / Platos) -->
    <button class="icon-button" aria-label="Platos Gourmet">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M2 18h20" />
        <path d="M20 18a8 8 0 0 0-16 0" />
        <circle cx="12" cy="6" r="1" />
      </svg>
    </button>

    <!-- Ícono 2: Cubertería Cruzada (Restaurante / Menú) -->
    <button class="icon-button" aria-label="Restaurante">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8Z" />
        <path d="M15 15 3.3 3.3a1.2 1.2 0 0 0-1.7 1.7L13.3 16.7" />
        <path d="m2 22 10-10" />
        <path d="M6.5 11.5 10 15" />
      </svg>
    </button>

    <!-- Ícono 3: Copa de Vino (Bebidas / Maridaje) -->
    <button class="icon-button" aria-label="Bebidas">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M8 22h8" />
        <path d="M12 15v7" />
        <path d="M12 15a7 7 0 0 0 7-7V3H5v5a7 7 0 0 0 7 7Z" />
      </svg>
    </button>
  </div>

</body>
</html>
